# @package _global_
# Phase O: HumanUP参考轨迹Stage II tracking起身.
# 复用G1MotionTrackingSACEnv(FastSAC off-policy), motion_file指向我们的getup轨迹.
# 起步从轨迹首帧(仰卧head_height 0.054), tracking getup起身轨迹到站立.
# Phase N翻身已100%成功, 本Phase专攻起身(仰卧→站立), 用参考轨迹引导.
# algo=sac(MLP actor), 起身专项可接受不用Mamba.
# Usage:
#   uv run scripts/train_offpolicy.py task=sac/g1_motion_tracking/mamba_phaseO algo=sac

training:
  task_name: G1MotionTrackingSAC
  sim_backend: mujoco
  play_steps: 1000

algo:
  num_envs: 2048
  max_iterations: 8000
  save_interval: 1000
  gamma: 0.99
  tau: 0.05
  num_atoms: 501
  updates_per_step: 4
  policy_frequency: 2
  use_symmetry: false
  algo_params:
    alpha_init: 0.1
    target_entropy_ratio: 0.5
    max_grad_norm: 10.0

env:
  motion_file: "logs/g1_reference_traj/getup_motion.npz"  # 我们的起身轨迹(58帧, 31body, 29DoF)
  sampling_mode: "start"            # 从轨迹首帧(仰卧)起步
  truncate_on_clip_end: true
  anchor_pos_z_threshold: 0.05       # 放宽(倒地段base_z 0.12不终止)
  ee_body_pos_z_threshold: 0.02     # 放宽(倒地时手脚贴地z低, 不该终止)
  control_config:
    action_scale: 2.0
  noise_config:
    level: 1.0
    scale_joint_angle: 0.01
    scale_joint_vel: 1.5
    scale_gyro: 0.2

reward:
  scales:
    # 主: 关节追踪(我们NPZ joint准, body_pos倒地段base_z不准)
    motion_joint_pos: 4.0
    motion_joint_vel: 1.0
    # 辅: body追踪(降权, 倒地段base_z偏移不准)
    motion_body_pos: 0.5
    motion_body_ori: 1.0
    motion_global_root_pos: 0.5
    motion_global_root_ori: 0.3
    motion_body_lin_vel: 0.5
    motion_body_ang_vel: 0.5
    # 通用
    action_rate_l2: -0.1
    joint_limit: -2.0
    undesired_contacts: -0.1
  std_root_pos: 0.3
  std_root_ori: 0.4
  std_body_pos: 0.3
  std_body_ori: 0.4
  std_body_lin_vel: 1.0
  std_body_ang_vel: 3.14
  std_joint_pos: 0.2
  std_joint_vel: 1.0
